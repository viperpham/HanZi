name: Deploy HanZi LMS
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted   # runner cài trên PC Ubuntu/VPS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        working-directory: ${{ github.workspace }}
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          EOF
          chmod 600 .env

      - name: Build & restart stack
        working-directory: ${{ github.workspace }}
        run: |
          docker compose build
          docker compose up -d
          docker system prune -f

      - name: Health check
        run: |
          sleep 10
          curl -sf http://localhost:8080/ > /dev/null && echo "Client OK"
          # 401 = API sống và auth middleware hoạt động (không phụ thuộc mật khẩu admin)
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/notifications/mine)
          [ "$code" = "401" ] && echo "API OK (auth sẵn sàng)" || { echo "API thất bại — HTTP $code"; exit 1; }
