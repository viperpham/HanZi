# Nginx: serve Angular SPA + proxy API sang server
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — mọi route không phải file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy sang container server
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
