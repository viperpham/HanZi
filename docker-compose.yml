# HanZi LMS — cả hệ thống trên 1 VPS/PC Ubuntu
# Chạy: docker compose up -d --build
# YÊU CẦU: file .env cạnh file này (copy từ .env.example) — thiếu là compose báo lỗi, KHÔNG chạy.
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hanzi
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=hanzi;Username=hanzi;Password=${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}"
      Jwt__Secret: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Push__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Push__PrivateKey: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - hzdata:/app/App_Data   # lưu VAPID keys sinh tự động — mất là client phải đăng ký lại push
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  hzdata:
