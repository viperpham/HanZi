# HanZi LMS — cả hệ thống trên 1 VPS/PC Ubuntu
# Chạy: docker compose up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hanzi
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanzi_dev_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=hanzi;Username=hanzi;Password=${POSTGRES_PASSWORD:-hanzi_dev_2026}"
      Jwt__Secret: ${JWT_SECRET:-HANZI_CHANGE_ME_SECRET_KEY_MIN_32_CHARACTERS!!}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
